akka {
  actor {
    provider = "cluster"
    default-dispatcher {
      fork-join-executor {
        parallelism-min = 8
        parallelism-factor = 3.0
        parallelism-max = 64
      }
    }
  }
  remote {
    artery {
      enabled = on
      transport = tcp
      canonical.hostname = "127.0.0.1"
      canonical.port = 25520
    }
  }
  cluster {
    seed-nodes = ["akka://MainSystem@127.0.0.1:25520"]
    roles = [main]
  }
}